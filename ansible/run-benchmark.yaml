- name: fetch logs from nodes
  hosts: nodes
  tasks:
    - name: fetch logs
      when: type == "pb"
      ansible.builtin.fetch:
        src: /root/pb-logs.txt
        dest: logs/{{now(fmt='%Y-%m-%d-%H:%M:%S')}}
